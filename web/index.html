<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看国债与政策性金融债的成交快照与个券走势。">
  <title>利率债 · 每日观察</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./csv-import.js" defer></script>
  <script src="./dashboard.js?v=2" defer></script>
</head>
<body>
  <header class="hero">
    <div class="shell hero-inner">
      <div>
        <p class="market">银行间市场</p>
        <h1>利率债 · 每日观察</h1>
        <p>国债与政策性金融债成交快照</p>
      </div>
      <div class="as-of">
        <span class="badge" id="mode">读取中</span>
        <strong id="hero-date">—</strong>
        <span id="source-time">行情日期</span>
      </div>
    </div>
  </header>

  <main class="shell">
    <p class="notice" id="notice" role="status">正在读取看板数据…</p>
    <div class="summary" id="summary" aria-label="各券种的快照记录数"></div>

    <section class="panel quotes" aria-labelledby="quote-title">
      <div class="panel-heading">
        <div><h2 id="quote-title">每日行情</h2><p id="row-count" aria-live="polite">正在读取数据</p></div>
        <div class="actions">
          <button id="open-csv" type="button">打开本机 CSV</button>
          <input id="local-files" type="file" accept=".csv,text/csv" multiple hidden>
          <button id="reload" type="button">刷新行情</button>
          <button class="primary" id="export" type="button" disabled>导出 CSV</button>
        </div>
      </div>
      <p class="hint import-status" id="import-status" role="status" hidden></p>
      <div class="filters">
        <label>行情日期<select id="date" aria-label="行情日期" disabled></select></label>
        <label>券种<select id="category">
          <option value="">全部券种</option><option>国债</option><option>国开债</option>
          <option>农发债</option><option>进出口行债</option>
        </select></label>
        <label>待偿期<select id="tenor">
          <option value="">全部期限</option><option value="0,1">1 年以内</option>
          <option value="1,3">1–3 年</option><option value="3,5">3–5 年</option>
          <option value="5,10">5–10 年</option><option value="10,Infinity">10 年及以上</option>
        </select></label>
        <label>搜索个券<input id="search" type="search" placeholder="输入债券代码或简称" autocomplete="off"></label>
      </div>
      <div class="table-scroll" tabindex="0" aria-label="个券行情表，可横向滚动">
        <table>
          <thead><tr>
            <th scope="col">债券代码</th><th scope="col">债券简称</th><th scope="col">券种</th>
            <th scope="col"><button class="sort" type="button" data-sort="term_years">待偿期 <small>年</small></button></th>
            <th scope="col"><button class="sort" type="button" data-sort="net_price">成交净价 <small>元</small></button></th>
            <th scope="col"><button class="sort" type="button" data-sort="latest_yield">最新收益率 <small>%</small></button></th>
            <th scope="col"><button class="sort" type="button" data-sort="weighted_yield">加权收益率 <small>%</small></button></th>
            <th scope="col"><button class="sort" type="button" data-sort="change_bp">涨跌 <small>BP</small></button></th>
            <th scope="col"><button class="sort" type="button" data-sort="volume">交易量 <small>亿</small></button></th>
            <th scope="col" id="quote-state-heading" hidden>行情状态</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="hint">点击债券代码查看走势。空值表示该字段暂无数据。</p>
    </section>

    <section class="panel trend" id="trend" aria-labelledby="trend-title">
      <div class="panel-heading">
        <div><h2 id="trend-title">个券走势</h2><p id="series-name" aria-live="polite">请选择一只债券</p></div>
        <label class="metric-label">指标<select id="metric">
          <option value="latest_yield">最新收益率（%）</option>
          <option value="net_price">成交净价（元）</option>
          <option value="volume">交易量（亿）</option>
        </select></label>
      </div>
      <canvas id="chart" role="img" aria-label="所选债券的每日行情走势"></canvas>
      <p class="hint" id="chart-summary"></p>
      <details id="series-details" hidden><summary>查看每日数值</summary><ul id="series-values"></ul></details>
    </section>

    <footer>
      <span id="source">成交行情快照 · 北京时间</span>
      <div><a id="latest-json" href="./data/latest.json" target="_blank" rel="noopener">最新行情 JSON ↗</a>
        <a id="manage" href="#" target="_blank" rel="noopener" hidden>GitHub 更新记录 ↗</a></div>
    </footer>
  </main>
</body>
</html>
