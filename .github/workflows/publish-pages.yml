name: 更新并发布债券看板

on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * *' # 20:37 in China (UTC+8)

permissions:
  contents: read

concurrency:
  group: bond-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name != 'schedule' || vars.BOND_PUBLISH_MODE == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate data and build the site
        env:
          BOND_PUBLISH_MODE: ${{ vars.BOND_PUBLISH_MODE }}
          BOND_FEED_URL: ${{ secrets.BOND_FEED_URL }}
          BOND_FEED_TOKEN: ${{ secrets.BOND_FEED_TOKEN }}
        run: python -m scripts.build_pages --mode "${BOND_PUBLISH_MODE:-demo}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
